name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/spectr1962/mit3:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://postgres:pass@localhost:5432/db
            AUTH_SECRET=placeholder_value_for_build_only
            GITHUB_CLIENT_ID=placeholder_value_for_build_only
            GITHUB_CLIENT_SECRET=placeholder_value_for_build_only
            NEXTAUTH_URL=http://localhost:3000

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Execute Remote SSH Commands on Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            docker pull ghcr.io/spectr1962/mit3:latest

            docker stop mit3-app || true
            docker rm mit3-app || true

            docker run -d \
              --name mit3-app \
              -p 3000:3000 \
              --add-host=host.docker.internal:host-gateway \
              --restart unless-stopped \
              -e NODE_ENV="production" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
              -e NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}" \
              ghcr.io/spectr1962/mit3:latest

            # Автоматическая синхронизация схемы базы данных при каждом деплое
            docker exec -e DATABASE_URL="${{ secrets.DATABASE_URL }}" mit3-app npx prisma db push

            docker image prune -f
