name: Production Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Образ тегируется как :latest, так и уникальным хэшем коммита ${{ github.sha }}
      # Это позволяет в любой момент мгновенно откатиться на предыдущую сборку
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/spectr1962/mit3:latest
            ghcr.io/spectr1962/mit3:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://postgres:pass@localhost:5432/db
            AUTH_SECRET=placeholder_value_for_build_only
            GITHUB_CLIENT_ID=placeholder_value_for_build_only
            GITHUB_CLIENT_SECRET=placeholder_value_for_build_only
            NEXTAUTH_URL=http://localhost:3000

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Execute Remote SSH Commands on Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Скачиваем свежий Docker-образ
            docker pull ghcr.io/spectr1962/mit3:latest

            # 2. Безопасно останавливаем старую версию приложения
            docker stop mit3-app || true
            docker rm mit3-app || true

            # 3. Запускаем новый контейнер
            docker run -d \
              --name mit3-app \
              -p 3000:3000 \
              --add-host=host.docker.internal:host-gateway \
              --restart unless-stopped \
              -e NODE_ENV="production" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
              -e NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}" \
              -e AUTH_TRUST_HOST="true" \
              -e GITHUB_CLIENT_ID="${{ secrets.AUTH_GITHUB_ID }}" \
              -e GITHUB_CLIENT_SECRET="${{ secrets.AUTH_GITHUB_SECRET }}" \
              ghcr.io/spectr1962/mit3:latest

            # 4. HEALTH CHECK (Защита от критических багов на старте)
            # Ждем 5 секунд и проверяем, живой ли процесс внутри Docker. 
            # Если Next.js упадет из-за бага, пайплайн прервется и покажет ошибку.
            sleep 5
            if [ "$(docker inspect -f '{{.State.Running}}' mit3-app)" != "true" ]; then
              echo "КРИТИЧЕСКАЯ ОШИБКА: Контейнер упал сразу после запуска!"
              docker logs mit3-app
              exit 1
            fi

            # 5. БЕЗОПАСНЫЕ МИГРАЦИИ PRISMA (Защита базы данных от уничтожения)
            # Заменяет небезопасный db push. Накатывает только зафиксированные SQL-файлы миграций.
            docker exec -e DATABASE_URL="${{ secrets.DATABASE_URL }}" mit3-app npx prisma migrate deploy

            # 6. АГРЕССИВНАЯ ОЧИСТКА СЕРВЕРА
            # Полностью удаляет старые слои и неиспользуемые тяжелые образы, освобождая диск VPS.
            docker image prune -af
