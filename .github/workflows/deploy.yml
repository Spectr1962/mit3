name: Production Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Образ тегируется как :latest, так и уникальным хэшем коммита ${{ github.sha }}
      # Это позволяет в любой момент мгновенно откатиться на предыдущую сборку
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/spectr1962/mit3:latest
            ghcr.io/spectr1962/mit3:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://postgres:pass@localhost:5432/db
            AUTH_SECRET=placeholder_value_for_build_only
            NEXTAUTH_URL=http://localhost:3000

      - name: Validate Production Auth Secrets
        env:
          AUTH_ADMIN_LOGIN: ${{ secrets.AUTH_ADMIN_LOGIN }}
          AUTH_ADMIN_PASSWORD: ${{ secrets.AUTH_ADMIN_PASSWORD }}
        run: |
          required_vars=(AUTH_ADMIN_LOGIN AUTH_ADMIN_PASSWORD)
          for variable_name in "${required_vars[@]}"; do
            if [ -z "${!variable_name}" ]; then
              echo "::error::Required auth secret is missing: ${variable_name}"
              exit 1
            fi
          done

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Execute Remote SSH Commands on Production Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          AUTH_ADMIN_LOGIN: ${{ secrets.AUTH_ADMIN_LOGIN }}
          AUTH_ADMIN_PASSWORD: ${{ secrets.AUTH_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: AUTH_ADMIN_LOGIN,AUTH_ADMIN_PASSWORD
          script: |
            # 1. Скачиваем свежий Docker-образ
            docker pull ghcr.io/spectr1962/mit3:latest

            # 2. Безопасно останавливаем старую версию приложения
            docker stop mit3-app || true
            docker rm mit3-app || true

            # 3. Запускаем новый контейнер
            docker run -d \
              --name mit3-app \
              -p 3000:3000 \
              --add-host=host.docker.internal:host-gateway \
              --restart unless-stopped \
              -e NODE_ENV="production" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
              -e NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}" \
              -e AUTH_TRUST_HOST="true" \
              -e AUTH_ADMIN_LOGIN="$AUTH_ADMIN_LOGIN" \
              -e AUTH_ADMIN_PASSWORD="$AUTH_ADMIN_PASSWORD" \
              ghcr.io/spectr1962/mit3:latest

            # 4. HEALTH CHECK (Защита от критических багов на старте)
            # Ждем 5 секунд и проверяем, живой ли процесс внутри Docker. 
            # Если Next.js упадет из-за бага, пайплайн прервется и покажет ошибку.
            sleep 5
            if [ "$(docker inspect -f '{{.State.Running}}' mit3-app)" != "true" ]; then
              echo "КРИТИЧЕСКАЯ ОШИБКА: Контейнер упал сразу после запуска!"
              docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' mit3-app || true
              docker logs --tail 100 mit3-app || true
              exit 1
            fi

            echo "Состояние контейнера и портов:"
            docker ps --filter name=mit3-app --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            if docker exec mit3-app sh -c 'test -n "$AUTH_ADMIN_LOGIN" && test -n "$AUTH_ADMIN_PASSWORD"'; then
              echo "Auth-переменные в контейнере присутствуют."
            else
              echo "КРИТИЧЕСКАЯ ОШИБКА: Auth-переменные не переданы в контейнер!"
              exit 1
            fi
            if docker exec mit3-app wget -q -O- http://127.0.0.1:3000/api/auth/providers >/dev/null; then
              echo "Auth API отвечает внутри контейнера."
            else
              echo "КРИТИЧЕСКАЯ ОШИБКА: Auth API не отвечает внутри контейнера!"
              docker logs --tail 100 mit3-app
              exit 1
            fi

            # 5. АГРЕССИВНАЯ ОЧИСТКА СЕРВЕРА
            # Полностью удаляет старые слои и неиспользуемые тяжелые образы, освобождая диск VPS.
            docker image prune -af
