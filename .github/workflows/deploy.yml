name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Авторизуемся в GitHub Packages
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем образ (имя строго маленькими буквами: spectr1962)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/spectr1962/mit3:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # Запустится только после успешной сборки
    steps:
      - name: Execute Remote SSH Commands on Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Скачиваем свежий готовый образ с GitHub Packages
            docker pull ghcr.io/spectr1962/mit3:latest
            
            # Останавливаем предыдущую версию контейнера, если она была
            docker stop mit3-app || true
            docker rm mit3-app || true
            
            # Запускаем приложение из нового Docker-образа
            # Передаем секрет DATABASE_URL из настроек GitHub в контейнер
            docker run -d \
              --name mit3-app \
              -p 3000:3000 \
              --restart unless-stopped \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              ghcr.io/spectr1962/mit3:latest
            
            # Удаляем старые неиспользуемые слои Docker, чтобы не забивать диск
            docker image prune -f
